<!DOCTYPE html>
<html lang="ko" data-platform="{{PLATFORM}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --accent: #1f5eff; --ink: #111; --muted: #555; --bg: #fff; --todo: #fff6cc; --w: {{WIDTH}}px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f4f6; color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; line-height: 1.65; word-break: keep-all; }
  main { max-width: var(--w); margin: 0 auto; background: var(--bg); }
  .sec { padding: 40px 24px; border-bottom: 1px solid #eee; }
  .sec.hero { padding-top: 0; }
  .sec.hero h2 { font-size: 30px; line-height: 1.25; }
  h2 { font-size: 24px; margin: 20px 0 12px; letter-spacing: -0.01em; }
  h3 { font-size: 18px; margin: 20px 0 8px; }
  p { margin: 0 0 12px; font-size: 16px; color: var(--ink); }
  ul { padding-left: 20px; margin: 0 0 12px; }
  li { margin: 4px 0; }
  figure { margin: 0 -24px 16px; }
  .sec.hero figure { margin-top: 0; }
  img { display: block; width: 100%; height: auto; }
  .cta { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 16px; border-radius: 12px; margin: 16px 0 0; font-size: 17px; }
  .todo { background: var(--todo); border: 1px dashed #d4a500; padding: 12px; border-radius: 8px; font-size: 14px; color: #6b5400; margin: 12px 0; }
  .todo-inline { background: var(--todo); padding: 0 4px; border-radius: 4px; color: #6b5400; }
  footer { padding: 24px; font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 420px) { .sec { padding: 32px 18px; } figure { margin: 0 -18px 16px; } .sec.hero h2 { font-size: 26px; } }
</style>
</head>
<body>
<main>
{{SECTIONS}}
<footer>이 시안은 sangse 스킬로 생성됐습니다. 가격·환불·기한 문구는 퍼블리시 전 직접 확인하세요.</footer>
</main>
</body>
</html>
